<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex UI Complex Frame</title>
  <style>
    body {
      margin: 0;
      padding: 18px;
      color: #17202a;
      background: #f7f9fb;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    input, button {
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid #9ba7b4;
      border-radius: 6px;
      background: #fff;
      font: inherit;
    }
    button { border-color: #155eef; color: #fff; background: #155eef; }
    output { display: block; margin-top: 12px; padding: 8px; border-left: 4px solid #7a8794; }
  </style>
</head>
<body>
  <label for="frameValue">iframe 输入</label>
  <div class="row">
    <input id="frameValue" data-testid="frame-value" value="">
    <button id="frameSubmit" data-testid="frame-submit" type="button">提交 iframe</button>
  </div>
  <output id="frameResult" data-testid="frame-result">FRAME:READY</output>
  <script>
    document.querySelector("#frameSubmit").addEventListener("click", () => {
      const value = document.querySelector("#frameValue").value.trim();
      document.querySelector("#frameResult").textContent = `SUCCESS:IFRAME:${value}`;
    });
  </script>
</body>
</html>
